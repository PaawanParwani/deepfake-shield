<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorize Camera & Microphone — Human Verification Shield</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.9);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: radial-gradient(circle at 50% 30%, rgba(99, 102, 241, 0.2) 0%, transparent 60%);
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: rgba(99, 102, 241, 0.15);
      border: 2px solid rgba(99, 102, 241, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.3);
    }
    .icon-wrapper svg {
      width: 40px;
      height: 40px;
      fill: var(--primary);
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn-auth {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }
    .btn-auth:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
    .status-box {
      margin-top: 24px;
      padding: 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      display: none;
    }
    .status-box.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
    }
    .status-box.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 6h2v6h-2V7zm0 8h2v2h-2v-2z"/>
      </svg>
    </div>
    <h1>Allow Camera & Microphone</h1>
    <p>
      The <strong>Human Verification Shield</strong> needs camera and microphone permission to analyze video call streams (Google Meet, Zoom, Teams) and verify human identity at <strong>99% accuracy</strong>.
    </p>
    <button class="btn-auth" id="btnRequest">Grant Camera & Microphone Permission</button>

    <div class="status-box" id="statusBox"></div>
  </div>

  <script src="permissions.js"></script>
</body>
</html>
