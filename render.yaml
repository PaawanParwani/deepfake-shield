services:
  - type: web
    name: deepfake-meeting-shield-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r deploy/render/requirements.txt
    startCommand: uvicorn demo.backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
