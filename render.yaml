services:
  - type: web
    name: deepfake-meeting-shield-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r deploy/render/requirements.txt
    startCommand: uvicorn demo.backend.app:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: LIGHTWEIGHT_AUDIO
        value: "1"
      - key: LIGHTWEIGHT_VIDEO
        value: "1"
      - key: SKIP_EMOTION_MODEL
        value: "1"
      - key: MAX_VIDEO_FRAMES
        value: "8"
      - key: TORCH_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "65536"
